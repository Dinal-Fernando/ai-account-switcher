# XcodeGen spec (fallback): `cd Xcode && xcodegen generate` regenerates AIAccountSwitcher.xcodeproj.
name: AIAccountSwitcher
options:
  bundleIdPrefix: dev.aiswitch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  AIAccountSwitcherPackage:
    path: ..
targets:
  AIAccountSwitcher:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/AIAccountSwitcherApp
    dependencies:
      - package: AIAccountSwitcherPackage
        product: SwitcherCore
      - package: AIAccountSwitcherPackage
        product: SwitcherMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aiswitch.AIAccountSwitcher
        PRODUCT_NAME: AIAccountSwitcher
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
